# Налаштування кабінету AutoProBazar Praha (Decap CMS)

backend:
  name: github
  repo: autoprobazar-praha/autoprobazar-praha.github.io
  branch: main
  site_domain: creative-lamington-6b7278.netlify.app
  commit_messages:
    create: "Нове авто: {{slug}}"
    update: "Зміни в авто: {{slug}}"
    delete: "Видалено авто: {{slug}}"
    uploadMedia: "Фото: {{path}}"
    deleteMedia: "Видалено фото: {{path}}"

locale: uk
site_url: https://autoprobazar-praha.cz
display_url: https://autoprobazar-praha.cz

# Куди складаються фото, які завантажує власник
media_folder: images/cars
public_folder: /images/cars

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: cars
    label: Авто
    label_singular: авто
    description: "Автомобілі на продаж. Нові авто показуються на сайті першими. Продане авто — відкрийте і натисніть «Видалити»."
    folder: cars
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: model
    slug: "{{make}}-{{model}}-{{year}}"
    summary: "{{make}} {{model}} {{variant}} · {{year}} · {{price}} Kč"
    preview_path: "{{slug}}.html"
    editor:
      preview: false
    sortable_fields: [added, price, year, make]
    fields:
      - { name: make, label: "Марка", widget: string, hint: "Наприклад: Škoda" }
      - { name: model, label: "Модель", widget: string, hint: "Наприклад: Superb III Combi" }
      - { name: variant, label: "Версія", widget: string, hint: "Показується фіолетовим під назвою. Наприклад: 2.0 TDI DSG" }
      - { name: price, label: "Ціна, Kč", widget: number, value_type: int, min: 0 }
      - { name: year, label: "Рік випуску", widget: number, value_type: int, min: 1950, max: 2100 }
      - { name: mileage, label: "Пробіг, km", widget: number, value_type: int, min: 0 }
      - name: fuel
        label: "Паливо"
        widget: select
        default: diesel
        options:
          - { label: "Дизель", value: diesel }
          - { label: "Бензин", value: benzin }
          - { label: "Гібрид", value: hybrid }
          - { label: "Електро", value: elektro }
          - { label: "ГБО (LPG)", value: lpg }
          - { label: "Метан (CNG)", value: cng }
      - name: transmission
        label: "Коробка передач"
        widget: object
        collapsed: false
        fields:
          - { name: cz, label: "Чеською", widget: string, hint: "Наприклад: Automat DSG, 7stupňový або Manuál" }
          - { name: ua, label: "Українською", widget: string, hint: "Наприклад: Автомат DSG, 7-ступенева або Механічна КПП" }
      - { name: power_kw, label: "Потужність, kW", widget: number, value_type: int, min: 1, hint: "Кінські сили сайт порахує сам" }
      - { name: engine, label: "Двигун", widget: string, hint: "Наприклад: 2.0 TDI" }
      - name: body
        label: "Тип кузова"
        widget: object
        collapsed: false
        fields:
          - { name: cz, label: "Чеською", widget: string, hint: "Наприклад: Kombi, Sedan, SUV" }
          - { name: ua, label: "Українською", widget: string, hint: "Наприклад: Універсал, Седан, Позашляховик" }
      - name: photos
        label: "Фото"
        label_singular: "фото"
        widget: list
        min: 1
        hint: "Перше фото — головне, воно показується в каталозі. Порядок можна змінювати перетягуванням."
        summary: "{{fields.src}}"
        fields:
          - { name: src, label: "Фото", widget: image, choose_url: false }
          - { name: alt, label: "Підпис до фото (необов'язково)", widget: string, required: false }
      - name: description
        label: "Опис автомобіля"
        widget: object
        collapsed: false
        fields:
          - { name: cz, label: "Опис чеською", widget: text }
          - { name: ua, label: "Опис українською", widget: text }
      - name: comfort
        label: "Комплектація — комфорт"
        label_singular: "пункт"
        widget: list
        required: false
        summary: "{{fields.cz}} / {{fields.ua}}"
        fields:
          - { name: cz, label: "Чеською", widget: string }
          - { name: ua, label: "Українською", widget: string }
      - name: safety
        label: "Комплектація — безпека"
        label_singular: "пункт"
        widget: list
        required: false
        summary: "{{fields.cz}} / {{fields.ua}}"
        fields:
          - { name: cz, label: "Чеською", widget: string }
          - { name: ua, label: "Українською", widget: string }
      - name: specs
        label: "Технічні характеристики"
        label_singular: "характеристику"
        widget: list
        required: false
        summary: "{{fields.label.cz}} / {{fields.label.ua}}: {{fields.value.cz}}"
        fields:
          - name: label
            label: "Назва"
            widget: object
            collapsed: false
            fields:
              - { name: cz, label: "Чеською", widget: string, hint: "Наприклад: Objem motoru" }
              - { name: ua, label: "Українською", widget: string, hint: "Наприклад: Об'єм двигуна" }
          - name: value
            label: "Значення"
            widget: object
            collapsed: false
            fields:
              - { name: cz, label: "Чеською", widget: string, hint: "Наприклад: 1 968 cm³" }
              - { name: ua, label: "Українською", widget: string, hint: "Наприклад: 1 968 см³" }
      - name: condition
        label: "Стан автомобіля"
        label_singular: "пункт"
        widget: list
        required: false
        summary: "{{fields.cz}} / {{fields.ua}}"
        fields:
          - { name: cz, label: "Чеською", widget: string }
          - { name: ua, label: "Українською", widget: string }
      - name: added
        label: "Дата додавання"
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD.MM.YYYY"
        time_format: false
        default: "{{now}}"
        hint: "Заповнюється сама. Новіші авто показуються на сайті першими."
      - name: meta_description
        label: "Опис для Google (необов'язково)"
        widget: text
        required: false
        hint: "Коротке речення для пошуку Google. Якщо залишити порожнім, сайт складе його сам."
